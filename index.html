:root{--bg:#F0F1F6;--tx:#1E2430;--ac:#B50000;--bt:#232A38;--line:rgba(30,36,48,.16);--edge:rgba(30,36,48,.18);--mut:rgba(30,36,48,.62)}

html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--tx);font:16px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;padding:calc(10px + env(safe-area-inset-top)) calc(10px + env(safe-area-inset-right)) calc(28px + env(safe-area-inset-bottom)) calc(10px + env(safe-area-inset-left))}
#app{max-width:560px;margin:0 auto}
button{font:inherit;color:inherit}
.bar{display:flex;align-items:center;background:var(--bt);border-radius:8px;padding:6px}
.bi{flex:1;display:flex;justify-content:center}
.ib{width:52px;height:48px;border:0;border-radius:8px;background:none;color:#fff;display:flex;align-items:center;justify-content:center}
.ib.hot{background:var(--ac)}
.ib svg{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.info{display:flex;background:#fff;border:1px solid var(--edge);border-radius:10px;padding:4px 6px;margin-top:10px}
.half{flex:1;min-width:0}
.dv{width:1px;background:rgba(30,36,48,.2);margin:2px 6px}
.il{display:flex;padding:3px 0;border-top:1px solid rgba(30,36,48,.12)}
.il:first-child{border-top:0}
.ic{flex:1;min-width:0;text-align:center}
.ic .l{font-size:10px;color:var(--mut);line-height:1.25}
.ic .v{font-size:15px;font-weight:700;line-height:1.3}
.fit{white-space:nowrap;overflow:hidden}
.card{background:#fff;border:1px solid var(--edge);border-radius:12px;overflow:hidden;margin-top:10px;scroll-margin-top:calc(8px + env(safe-area-inset-top))}
.ch{display:flex;align-items:center;background:#E3E4E9;padding:7px 14px;font-weight:700;font-size:14px;cursor:pointer;user-select:none}
.ch .t{flex:1}
.ch .s{font-size:20px;line-height:1}
.cb{padding:2px 12px 4px}
.cb[hidden]{display:none}
.row{border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.line{display:flex;align-items:center;padding:6px 0}
.lab{flex:0 0 38%;text-align:center;color:var(--ac);font-weight:700;font-size:14px;padding-right:6px}
.rt{flex:1;min-width:0}
.mrow{display:flex;gap:8px;padding:6px 0}
.mc{display:flex;flex-direction:column;min-width:0}
.mh{display:flex;align-items:center;justify-content:center;text-align:center;color:var(--ac);font-weight:700;font-size:13px;padding:0 2px 2px}
.in{display:block;width:100%;border:0;border-bottom:1px solid rgba(30,36,48,.55);border-radius:0;background:transparent;text-align:center;font:inherit;font-size:16px;min-height:44px;padding:8px 6px;color:var(--tx);outline:none}
.in:focus{border-bottom-color:var(--ac)}
.tb{display:block;width:100%;min-height:48px;background:#fff;border:1px solid #000;border-radius:10px;font-size:16px;color:#000;padding:0 4px}
.tb:active{background:#eee}
.rg{display:flex;gap:6px}
.tot{font-size:18px;font-weight:700;color:var(--ac);text-align:center;min-height:44px;line-height:44px}
.dly .cols{display:flex;padding-top:6px}
.dc{flex:1;min-width:0;text-align:center;padding:0 2px}
.dc .h{font-size:12px;font-weight:700;color:var(--mut);min-height:2.4em;display:flex;align-items:center;justify-content:center;line-height:1.2}
.dc .v{font-size:18px;font-weight:700;color:var(--ac)}
.rd{text-align:center;font-size:13px;color:rgba(30,36,48,.75);padding:4px 0 6px}
textarea.nt{display:block;width:100%;min-height:130px;border:0;border-bottom:1px solid rgba(30,36,48,.55);background:transparent;font:inherit;font-size:16px;color:var(--tx);padding:8px 4px;resize:vertical;outline:none;border-radius:0}
.ver{text-align:center;font-size:11px;color:var(--mut);margin-top:16px}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;z-index:10;padding:16px}
.dlg{background:#fafafa;border-radius:24px;padding:20px 20px 14px;width:min(88vw,340px)}
.dlg h2{margin:0 0 4px;font-size:18px;font-weight:700}
.dlg p{margin:6px 0 4px;font-size:15px}
.wh{display:flex;justify-content:center;align-items:center;gap:6px;position:relative;height:160px;margin:10px 0}
.wc{height:160px;width:90px;overflow-y:scroll;scroll-snap-type:y mandatory;padding:60px 0;scrollbar-width:none;-webkit-overflow-scrolling:touch;text-align:center;overscroll-behavior:contain}
.wc::-webkit-scrollbar{display:none}
.wc div{height:40px;line-height:40px;font-size:24px;scroll-snap-align:center}
.wcol{font-size:30px;font-weight:700}
.band{position:absolute;left:18%;right:18%;top:60px;height:40px;border-top:1px solid #aaa;border-bottom:1px solid #aaa;pointer-events:none}
.db{display:flex;gap:4px;margin-top:6px}
.db button{flex:1;min-height:44px;border:0;background:none;font-size:16px;font-weight:700;border-radius:10px}
.db button:active{background:#e6e6e6}
.db .sp{flex:1.2}
.toast{position:fixed;left:50%;bottom:calc(28px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--bt);color:#fff;padding:10px 16px;border-radius:20px;font-size:14px;z-index:20;max-width:90vw;text-align:center}

const APP_VERSION = "1.1";

const fields = LAYOUT.fields, sections = LAYOUT.sections, infos = LAYOUT.info;
let vals = {}, notes = "", openSec = "";
try {
  vals = JSON.parse(localStorage.getItem("tkr_vals") || "{}");
  notes = localStorage.getItem("tkr_notes") || "";
  openSec = localStorage.getItem("tkr_open") || "";
} catch (e) {}
function save() {
  try {
    localStorage.setItem("tkr_vals", JSON.stringify(vals));
    localStorage.setItem("tkr_notes", notes);
    localStorage.setItem("tkr_open", openSec);
  } catch (e) {}
}

const pad = n => String(n).padStart(2, "0");
const byId = id => fields.find(f => f.id === id);
const num = s => (s != null && String(s).trim() !== "" && !isNaN(Number(s))) ? Number(s) : null;
function mins(s) {
  if (!s) return null;
  const p = String(s).split(":"); if (p.length !== 2) return null;
  const h = parseInt(p[0], 10), m = parseInt(p[1], 10);
  return (isNaN(h) || isNaN(m)) ? null : h * 60 + m;
}
const fmtMin = m => (m < 0 ? "-" : "") + pad(Math.floor(Math.abs(m) / 60)) + ":" + pad(Math.abs(m) % 60);
const fmtNum = v => v == null ? "—" : String(Number(v.toFixed(2)));
const A = f => vals[f.id + ".a"] || "";
const B = f => vals[f.id + ".b"] || "";

function valueOf(f) {
  if (f.type === "number") return num(A(f));
  if (f.type === "duration") return (mins(A(f) || "00:00") || 0) / 60;
  if (f.type === "range") {
    const s = mins(A(f)), e = mins(B(f));
    if (s != null && e != null) { let d = (e - s) / 60; if (d < 0) d += 24; return d; }
  }
  return null;
}
function parseTerms(s) {
  const out = {};
  (s || "").split(";").forEach(t => { const p = t.split(":"); if (p.length === 2 && !isNaN(parseInt(p[1], 10))) out[p[0]] = parseInt(p[1], 10); });
  return out;
}
function total(f) {
  let sum = 0, any = false;
  for (const [id, sign] of Object.entries(parseTerms(f.terms))) {
    const src = byId(id); if (!src) continue;
    const v = valueOf(src); if (v == null) continue;
    sum += sign * v;
    if (src.type !== "duration" || A(src) !== "") any = true;
  }
